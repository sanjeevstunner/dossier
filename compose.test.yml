# Throwaway Postgres for `*.db.test.ts`, in RAM so it's fast and leaves nothing behind.
#   docker compose -f compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/dossier_test yarn test:coverage
#   docker compose -f compose.test.yml down
services:
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dossier_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dossier_test"]
      interval: 2s
      timeout: 3s
      retries: 15
